[pytest]
# Alle schnellen Tests (ohne laufendes ROS-System): Unit-Tests der Pakete, synchroner Regelkreis
# Simulation+Controller, Greif-Regression. Sie pruefen den Quellbaum (conftest.py). Aufruf aus dem Projekt-Root: python3 -m pytest -q
# Systemtests (ros2 launch) liegen in tests/system/ und werden einzeln gestartet (tests/alle_tests.sh).
testpaths =
    src/roboter_steuerung/test
    src/roboter_sensorik/test
    src/roboter_task_planning/test
    tests/simulation
python_files = test_*.py
