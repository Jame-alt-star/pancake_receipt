# Mission in der Testwelt: a besuchen, in b balancieren und warten.
# Der direkte Weg start->a kreuzt das Hindernis, a->b muss durch die Tuer (Orte: roboter_welten/welten/testwelt/orte.yaml).
welt: testwelt
start_ort: start
ziele:
  - {art: besucht,    ort: a}
  - {art: balanciert, ort: b}
  - {art: gewartet,   ort: b}
parameter:
  warte_s: 2.0
  balancier_toleranz_grad: 5.0
  nav_toleranz_m: 0.3
  nav_geschwindigkeit: 0.4
  max_replans: 2
