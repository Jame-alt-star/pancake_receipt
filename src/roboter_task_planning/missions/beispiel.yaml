# Beispiel-Mission (Layer 1) in der Welt 'leer' (Ebene ohne Hindernisse, Orte in roboter_welten/welten/leer/orte.yaml).
welt: leer
start_ort: start        # optional; sonst naechster Ort zur aktuellen Position
ziele:
  - {art: besucht,    ort: a}
  - {art: balanciert, ort: b}
  - {art: gewartet,   ort: b}
parameter:
  warte_s: 3.0
  balancier_toleranz_grad: 5.0
  nav_geschwindigkeit: 0.4
  max_replans: 2
