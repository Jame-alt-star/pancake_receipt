# Beispiel-Mission (Layer 1). Koordinaten im Welt-/map-Frame in Metern.
orte:
  start: {x: 0.0, y: 0.0}
  a:     {x: 3.0, y: 0.0}
  b:     {x: 3.0, y: 2.0}
# Ungerichtete Verbindungen; fehlt der Schluessel, ist jeder Ort mit jedem verbunden.
verbindungen:
  - [start, a]
  - [a, b]
  - [b, start]
start_ort: start        # optional; sonst naechster Ort zur aktuellen Position
ziele:
  - {art: besucht,    ort: a}
  - {art: balanciert, ort: b}
  - {art: gewartet,   ort: b}
parameter:
  warte_s: 3.0
  balancier_toleranz_grad: 5.0
  nav_toleranz_m: 0.3
  nav_geschwindigkeit: 0.4
  max_replans: 2
