# Patrouille in der Testwelt: a und b besuchen, in b balancieren, am Ende zurueck zum Start.
welt: testwelt
start_ort: start
ziele:
  - {art: besucht,    ort: a}
  - {art: besucht,    ort: b}
  - {art: balanciert, ort: b}
  - {art: am_ort,     ort: start}
parameter:
  warte_s: 2.0
  balancier_toleranz_grad: 5.0
  nav_toleranz_m: 0.3
  nav_geschwindigkeit: 0.4
  max_replans: 2
