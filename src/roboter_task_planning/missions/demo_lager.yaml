# Demo "Kontrollrundgang im Lager": Pruefpunkte K1 (Regalgang), K2 (Hallenecke) und K3 (Buero, durch die
# Tuer) anfahren, am Buero-Pruefpunkt balancieren und warten, zur Ladestation zurueck. Hindernisse umfaehrt Nav2
# anhand des Lidars. Orte: roboter_welten/welten/demo_lager/orte.yaml.
welt: demo_lager
start_ort: start
ziele:
  - {art: besucht,    ort: k1}
  - {art: besucht,    ort: k2}
  - {art: besucht,    ort: k3}
  - {art: balanciert, ort: k3}
  - {art: gewartet,   ort: k3}
  - {art: am_ort,     ort: lader}
parameter:
  warte_s: 3.0
  balancier_toleranz_grad: 5.0
  nav_geschwindigkeit: 0.4
  max_replans: 2
