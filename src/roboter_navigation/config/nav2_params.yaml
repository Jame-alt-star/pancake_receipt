# Generische Nav2-Konfiguration fuer den G1 (Layer 2) mit EINEM 3D-Lidar - PLATZHALTER.
# Costmaps lesen die vorverarbeitete Punktwolke (/punkte_hindernis, aus /points); /scan (fuer slam_toolbox und collision_monitor) wird
# von punktwolke_zu_scan daraus abgeleitet. Alte Variante mit nur einer Scanebene: nav2_params_2d.yaml.
# Die Variante des Kollegen ersetzt diese Datei (oder wird per params_file:=... uebergeben).
#
# Randbedingungen aus Layer 3 (gemessen, siehe statusupdate_g1_projekt.md):
#   - Kommandobereich (Layer 3 clippt): vx -0.5..1.0, vy +-0.3, wz +-1.0 rad/s.
#     Gemessen: kleine wz (< ~0.5) werden im STAND fast ignoriert (0.2 -> 0.025 rad/s), beim
#     Gehen folgt die Policy gut (~75 %). Drehen auf der Stelle daher mit wz ~1.0 (-> ~0.5 rad/s).
#   - unter ~0.3 m/s laeuft der Roboter nicht an (Totzone)
#   - Beschleunigung in Layer 3 auf 1.0 m/s^2 gerampt
# Sensorik: simuliertes 2D-Lidar (/scan, Frame lidar_link) aus mujoco_node -> ObstacleLayer in
# beiden Costmaps und collision_monitor. Lokalisierung: Ground-Truth (/odom, TF odom->base_link);
# map->odom statische Identitaet (siehe launch/navigation.launch.py), Costmaps rollen im odom-Frame.

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    # Standard-BT mit Neuplanung/Recovery aus nav2_bt_navigator (kein eigener Pfad noetig)

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    odom_topic: /odom

    progress_checker:
      plugin: "nav2_controller::PoseProgressChecker"   # zaehlt auch Drehung als Fortschritt
      required_movement_radius: 0.15
      required_movement_angle: 0.3
      movement_time_allowance: 25.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 6.28        # Zielausrichtung egal (Layer 1 hat nur Positionsziele)
      stateful: true

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.45
      lookahead_dist: 0.6
      min_lookahead_dist: 0.4
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 1.0     # unterhalb ~0.5 dreht die Policy im Stand kaum
      transform_tolerance: 0.2
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.3      # oberhalb der Totzone der Policy
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: false         # keine Sensorik
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.3
      use_cost_regulated_linear_velocity_scaling: false
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.5
      # RPP begrenzt die Drehbeschleunigung relativ zur GEMESSENEN Drehrate. Die Policy reagiert im
      # Stand auf kleine wz kaum -> Messung bleibt ~0 und der Befehl klebt bei accel*dt. Daher so
      # gross, dass ein Schritt (dt=0.05 s) sofort rotate_to_heading_angular_vel erreicht.
      max_angular_accel: 25.0
      allow_reversing: false

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      robot_radius: 0.36
      plugins: ["voxel_layer", "inflation_layer"]
      # VoxelLayer statt ObstacleLayer: loescht (clearing) entlang der Strahlen in 3D. Die 2D-
      # ObstacleLayer projiziert die Strahlen auf den Boden und loescht damit niedrige Hindernisse,
      # ueber die Strahlen zur Wand hinweggehen (gemessen: Palette nur auf 0.18 m umfahren).
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: true           # Voxel fuer RViz (/local_costmap/voxel_marked_cloud)
        origin_z: 0.0
        z_resolution: 0.15
        z_voxels: 14
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: points
        points:
          topic: /punkte_hindernis      # gefiltert + ausgeduennt aus /points (punktwolke_zu_scan)
          sensor_frame: lidar_link
          data_type: "PointCloud2"
          marking: true
          clearing: true
          max_obstacle_height: 1.9
          min_obstacle_height: 0.12          # Boden (z ~ 0) ausblenden
          obstacle_max_range: 5.0
          obstacle_min_range: 0.3
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          expected_update_rate: 0.6
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map                      # Ziele kommen im map-Frame; rollendes Fenster
      robot_base_frame: base_link
      rolling_window: true
      width: 24
      height: 24
      resolution: 0.1
      robot_radius: 0.36
      track_unknown_space: false
      plugins: ["voxel_layer", "inflation_layer"]
      # VoxelLayer statt ObstacleLayer: loescht (clearing) entlang der Strahlen in 3D. Die 2D-
      # ObstacleLayer projiziert die Strahlen auf den Boden und loescht damit niedrige Hindernisse,
      # ueber die Strahlen zur Wand hinweggehen (gemessen: Palette nur auf 0.18 m umfahren).
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: false
        origin_z: 0.0
        z_resolution: 0.15
        z_voxels: 14
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: points
        points:
          topic: /punkte_hindernis      # gefiltert + ausgeduennt aus /points (punktwolke_zu_scan)
          sensor_frame: lidar_link
          data_type: "PointCloud2"
          marking: true
          clearing: true
          max_obstacle_height: 1.9
          min_obstacle_height: 0.12          # Boden (z ~ 0) ausblenden
          obstacle_max_range: 5.0
          obstacle_min_range: 0.3
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          expected_update_rate: 0.6
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    # Hinweis (Review L8): BackUp faehrt mit der BT-Standardgeschwindigkeit (~0.05 m/s) - unter der Totzone
    # der Policy (~0.3 m/s), als Recovery also praktisch wirkungslos. Bleibt drin, weil der Standard-BT
    # die Aktion erwartet; eine eigene BT-Datei mit angepasster Geschwindigkeit waere der saubere Weg.
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.8
    rotational_acc_lim: 3.0

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    # Grenzen = Kommandobereich der Policy (vy bleibt 0: Differentialfahrt)
    max_velocity: [0.6, 0.0, 1.0]
    min_velocity: [-0.3, 0.0, -1.0]
    max_accel: [0.8, 0.0, 3.0]
    max_decel: [-1.0, 0.0, -3.0]
    odom_topic: "/odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

# collision_monitor ist in Jazzy fester Teil der Nav2-Kette (velocity_smoother -> collision_monitor
# -> /cmd_vel): bremst per 'approach' vor vorhergesagten Kollisionen mit dem Lidar-Scan.
collision_monitor:
  ros__parameters:
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6
      visualize: false
      enabled: true
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "scan"
      min_height: 0.0
      max_height: 2.0
      enabled: true

# docking_server gehoert in Jazzy zur Standard-Lifecycle-Kette und verlangt Plugin-Konfiguration,
# wird hier aber nicht benutzt (keine Ladestation; Zustand "Laden" ist Layer 3 und ausgestellt).
docking_server:
  ros__parameters:
    controller_frequency: 20.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: "base_link"
    fixed_frame: "odom"
    dock_backwards: false
    dock_prestaging_tolerance: 0.5
    dock_plugins: ['simple_charging_dock']
    simple_charging_dock:
      plugin: 'opennav_docking::SimpleChargingDock'
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: true
      use_battery_status: false
      use_stall_detection: false
      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1
    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.15
      v_linear_max: 0.15
      use_collision_detection: false
      costmap_topic: "local_costmap/costmap_raw"
      footprint_topic: "local_costmap/published_footprint"
      transform_tolerance: 0.1
      projection_time: 5.0
      simulation_step: 0.1
      dynamic_window:
        min_linear_vel: 0.15
        max_linear_vel: 0.15
        min_angular_vel: -0.2
        max_angular_vel: 0.2
