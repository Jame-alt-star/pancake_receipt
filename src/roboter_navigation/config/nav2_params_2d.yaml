# Overlay fuer lidar_modus:=2d (eine Scanebene statt 3D-Lidar, nur zum Vergleich). Enthaelt NUR die Unterschiede zu
# nav2_params.yaml; navigation.launch.py legt diese Datei ueber die Basisdatei (frueher eine fast vollstaendige Kopie,
# die bei jeder Nav2-Aenderung doppelt gepflegt werden musste).
# Unterschied: ObstacleLayer auf /scan statt VoxelLayer auf der Hinderniswolke (sieht niedrige Hindernisse nicht -
# genau das zeigt der Vergleichstest integration_mission.py --nur-2d) und etwas kleinerer Roboterradius.
local_costmap:
  local_costmap:
    ros__parameters:
      robot_radius: 0.30
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer: &obstacle_layer
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          sensor_frame: lidar_link
          data_type: "LaserScan"
          marking: true
          clearing: true
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          obstacle_max_range: 6.0
          obstacle_min_range: 0.0
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          inf_is_valid: true
          expected_update_rate: 0.5
global_costmap:
  global_costmap:
    ros__parameters:
      robot_radius: 0.30
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer: *obstacle_layer
