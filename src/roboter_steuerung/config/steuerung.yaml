# Laufzeitparameter der Layer-3-Knoten (eine Quelle; die Launch-Datei laedt diese Datei immer).
# Launch-Argumente ueberschreiben nur, was beim Start bewusst gewaehlt wird (cmd_vel_timeout_s).
# Die trainierte Policy selbst steht in policy_29dof.yaml.

steuereinheit_node:
  ros__parameters:
    policy_config: "policy_29dof.yaml"   # Datei in config/ dieses Pakets
    # /cmd_vel-Watchdog [s]: ohne neue Nachricht wird das Kommando 0 (0 = aus). system.launch.py setzt 1.0,
    # sobald eine Navigation laeuft (dauernder Befehlsstrom), sonst 0 (Handbetrieb mit Einzelbefehlen).
    cmd_vel_timeout_s: 0.0
    # true = jedes /cmd_vel gibt frei (alter Handbetrieb); Standard: Freigabe nur ueber /freigabe.
    freigabe_per_cmd_vel: false
    # Positionshaltung im Zustand Balancieren (gemessen: ~1 cm in 60 s statt 32 cm Drift).
    position_hold: true
    # Sicherheit: aelter als sensor_timeout_s -> Stoerung (Sensorausfall); staerker geneigt als sturz_neigung_grad
    # -> Stoerung (Sturz). Gemessen (21.10.2026, realistisch + Beinodometrie, WSL2): Sensordaten alle 10 ms, Luecken
    # max. 34-43 ms. In Testserien blieben einzelne Nachrichten 0,35-1 s aus - sehr wahrscheinlich wegen verwaister
    # Fast-DDS-Speichersegmente nach per SIGKILL beendeten Prozessen (seit tests/system/stop_all.sh sie aufraeumt,
    # siehe Verlauf). 1 s liegt mit Abstand ueber normalen Luecken und erkennt einen echten Ausfall innerhalb 1 s.
    sensor_timeout_s: 1.0
    sturz_neigung_grad: 45.0
    # Groesster Sprung eines Zielwinkels je Regeltakt (20 ms); groessere werden begrenzt und gemeldet. Gemessen
    # (21.10.2026, synchroner Kreis, 8 Szenarien: Stehen, Vollgas, abrupter Stopp, Drehen, Wechsel, 20-30 ms Latenz mit
    # Rauschen): hoechstens 0,315 rad (Knie/Fuss). 0,6 rad ~ doppelter Abstand - greift nur bei Ausreissern.
    max_zielsprung_rad: 0.6
    # Takt der Regelung: sensor = im Takt der Sensordaten (Gelenke und IMU, Simulationszeit), timer = ROS-Timer (Wanduhr)
    takt_quelle: "sensor"
    sensor_periode_s: 0.01      # Simulation: 100 Hz; echte Hardware: Rate des Unitree-LowState
    # Armfuehrung (Greifen, armfuehrung.py): ohne Armkommando laenger als arme_timeout_s wird gehalten;
    # Armziele aendern sich hoechstens um arme_max_rate rad/s; Taille Pitch bei voller Neigung (Gegengewicht zur Last
    # vor dem Koerper, gemessener Betriebspunkt -0.15 rad, docs/statusupdate_g1_projekt.md).
    arme_timeout_s: 0.5
    arme_max_rate: 2.0
    manipulieren_taille_pitch: -0.15

balance_dienst_node:
  ros__parameters:
    stabil_grenze_grad: 15.0   # Neigung, ab der /gleichgewicht "nicht stabil" meldet

beinodometrie_node:
  ros__parameters:
    start_position: [0.0, 0.0, -1.0]   # z < 0: becken_hoehe_stand aus roboter_beschreibung
    odom_frame: "odom"
    base_frame: "base_link"
    sigma_position_m: 0.05            # Standardabweichungen fuer die Kovarianz in /odom
    sigma_gier_rad: 0.02
    sigma_geschwindigkeit_m_s: 0.05
