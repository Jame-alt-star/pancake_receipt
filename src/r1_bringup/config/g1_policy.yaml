# Konfiguration fuer die G1-RL-Policy (12-DOF, nur Beine).
# Wird von mujoco_node.py (Simulation) und steuereinheit_node.py
# (RL-Regelung) beim Start gelesen.

# Pfad zur trainierten Policy (TorchScript-Netz, aus unitree_rl_gym trainiert).
policy_path: "models/policies/motion.pt"
# MuJoCo-Szene, die geladen wird - bindet g1_12dof.xml ein, siehe
# models/robots/g1_description/scene.xml.
xml_path: "models/robots/g1_description/scene_lauf.xml"

# Hinweis: wird aktuell von keinem der beiden Knoten tatsaechlich
# gelesen/verwendet (toter Konfigurationswert, siehe offene Punkte).
simulation_duration: 60.0

# Physik-Zeitschritt in Sekunden (0.002s = 500 Hz Simulationsrate).
simulation_dt: 0.002
# Alle wie viele Physik-Schritte die Policy neu rechnet. 10 * 0.002s
# = 0.02s -> 50 Hz Regeltakt.
control_decimation: 10

# PD-Reglerwerte (Steifigkeit/Daempfung) je Gelenk - Reihenfolge muss zur
# Gelenkreihenfolge in g1_12dof.xml passen. Herkunft dieser konkreten
# Zahlen ist nicht dokumentiert - vor Verlass darauf mit dem urspruenglichen
# Trainings-/Ansteuerungsskript abgleichen (siehe offene Punkte).
kps: [100, 100, 100, 150, 40, 40, 100, 100, 100, 150, 40, 40]
kds: [2, 2, 2, 4, 2, 2, 2, 2, 2, 4, 2, 2]

# Neutrale Ruhepose (12 Gelenke) - Referenzpunkt, auf den die Policy-
# Aktion aufgeschlagen wird (siehe action_scale unten und
# rl_locomotion_controller.py).
default_angles: [-0.1,  0.0,  0.0,  0.3, -0.2, 0.0, 
                  -0.1,  0.0,  0.0,  0.3, -0.2, 0.0]

# Skalierungsfaktoren fuer den Beobachtungsvektor - muessen exakt zu den
# Werten passen, mit denen die Policy trainiert wurde (nicht frei
# waehlbar), siehe rl_locomotion_controller.py.
ang_vel_scale: 0.25
dof_pos_scale: 1.0
dof_vel_scale: 0.05
action_scale: 0.25
cmd_scale: [2.0, 2.0, 0.25]

num_actions: 12   # Anzahl gesteuerter Gelenke (Groesse der Policy-Aktion)
num_obs: 47        # Groesse des Beobachtungsvektors, den die Policy erwartet

# Start-/Default-Geschwindigkeitskommando [vx, vy, wz]. Wird aktuell nur
# einmalig beim Start gelesen - noch kein /cmd_vel-Topic (siehe offene
# Punkte zur Steuerung).
cmd_init: [0.5, 0, 0]
