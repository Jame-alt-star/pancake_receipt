# Schnelle Tests bei jedem Push (ohne ROS, ohne Fast Downward, ohne Simulation in Echtzeit).
# Was ROS braucht (rclpy) oder Fast Downward, ueberspringen die Tests selbst; die Systemtests (tests/system, ros2
# launch) laufen nur lokal: bash tests/alle_tests.sh.
name: schnelle Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python-Pakete
        run: |
          python -m pip install --upgrade pip
          pip install mujoco==3.13.0 onnxruntime==1.31.0 numpy==1.26.4 PyYAML==6.0.1 pytest
      - name: pytest
        # kein MUJOCO_GL setzen: die Tests rendern nicht; mit MUJOCO_GL=egl scheiterte schon der Import (kein EGL auf
        # dem GitHub-Rechner)
        run: python -m pytest -q -rs
